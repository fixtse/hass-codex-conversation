name: Release

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  tests:
    uses: ./.github/workflows/tests.yml

  validate:
    uses: ./.github/workflows/validate.yml

  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    needs: [lint, tests, validate]

    concurrency:
      group: release
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Install python-semantic-release
        run: uv tool install python-semantic-release==10.5.3

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Semantic Release — version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Exit code 2 means "no release needed" — treat as success, skip publish
        run: uv tool run --from python-semantic-release semantic-release version
        continue-on-error: true

      - name: Semantic Release — publish
        if: steps.version.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv tool run --from python-semantic-release semantic-release publish

  notify:
    name: Report release result
    runs-on: ubuntu-latest
    if: always()
    needs: [lint, tests, validate, release]

    steps:
      - name: Notify the release status
        env:
          WEBHOOK_URL: ${{ secrets.T3_RELEASE_WEBHOOK }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_STATUS: ${{ needs.release.result }}
          LINT_STATUS: ${{ needs.lint.result }}
          TEST_STATUS: ${{ needs.tests.result }}
          VALIDATE_STATUS: ${{ needs.validate.result }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          REVISION: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          payload = {
              "run_id": os.environ["RUN_ID"],
              "run_number": os.environ["RUN_NUMBER"],
              "run_attempt": os.environ["RUN_ATTEMPT"],
              "status": os.environ["RUN_STATUS"],
              "jobs": {
                  "lint": os.environ["LINT_STATUS"],
                  "tests": os.environ["TEST_STATUS"],
                  "validate": os.environ["VALIDATE_STATUS"],
                  "release": os.environ["RUN_STATUS"],
              },
              "repository": os.environ["REPOSITORY"],
              "branch": os.environ["BRANCH"],
              "revision": os.environ["REVISION"],
              "url": os.environ["RUN_URL"],
          }
          request = urllib.request.Request(
              os.environ["WEBHOOK_URL"],
              data=json.dumps(payload).encode(),
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "hass-codex-conversation-release/1.0",
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=15) as response:
                  print(f"Release callback accepted: HTTP {response.status}")
          except Exception as err:
              detail = str(err)[:300]
              print(f"Release callback failed ({type(err).__name__}): {detail}")
              raise
          PY
