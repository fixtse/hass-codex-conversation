[project]
name = "hass-codex-conversation"
version = "1.3.1"
description = "Home Assistant custom integration for OpenAI Codex"
readme = "README.md"
requires-python = ">=3.14.2"
dependencies = []   # runtime deps are managed by Home Assistant itself

[dependency-groups]
dev = [
    { include-group = "test" },
    "homeassistant==2026.9.4",
    "voluptuous-openapi==0.4.1",
    "gazetteer-matcher==1.1.0",
    "PyTurboJPEG==1.8.3",
    "hassil>=3.12.1",
    "home-assistant-intents>=2026.9.30",
    "aiodiscover>=3.3.2",
    "pre-commit",
    "ruff>=0.16.10",
]
test = [
    "pytest",
    "pytest-cov",
    "pytest-mock",
    "pytest-homeassistant-custom-component==0.13.367",
    "pytest-asyncio",
    "async-timeout",
]

# ── Ruff (replaces flake8 + isort) ────────────────────────────────────────────

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components.codex_conversation"]
combine-as-imports = true

# ── Semantic Release ───────────────────────────────────────────────────────────

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = ["custom_components/codex_conversation/manifest.json:version"]
tag_format = "v{version}"
commit_message = "chore(release): {version} [skip ci]"

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.remote]
name = "origin"
type = "github"

[tool.semantic_release.publish]
dist_glob_patterns = []
upload_to_vcs_release = false

# ── Pytest ─────────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
addopts = "-qq --cov=custom_components.codex_conversation"
console_output_style = "count"
asyncio_mode = "auto"
testpaths = ["tests"]

# ── Coverage ───────────────────────────────────────────────────────────────────

[tool.coverage.run]
branch = false

[tool.coverage.report]
show_missing = true
